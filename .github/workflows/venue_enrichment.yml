name: Venue Directory Weekly AI Enrichment

on:
  schedule:
    # Runs every Saturday at 8:00 AM America/Los_Angeles (Pacific Time)
    # 8:00 AM PST = 16:00 UTC (during Standard Time) / 15:00 UTC (during Daylight Saving Time).
    # 15:00 UTC and 16:00 UTC are mapped to cover Saturday morning across seasonal shifts.
    - cron: '0 15 * * 6'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of venues per crawl batch'
        required: false
        default: '50'
      max_rounds:
        description: 'Number of consecutive batches to execute'
        required: false
        default: '5'

jobs:
  venue-enrichment:
    name: Crawl & AI-Enrich Venue Booking Inboxes
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai aiohttp beautifulsoup4 supabase pydantic

      - name: Execute Venue Enrichment Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://papzanzgzoghrrgdzvfo.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '50' }}
          MAX_ROUNDS: ${{ github.event.inputs.max_rounds || '5' }}
        run: |
          echo "Starting autonomous weekly enrichment..."
          python phase2_ai_enrichment.py
